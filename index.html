<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>Haya | Modest Fashion, Abayas & Hijabs in India</title>

    <meta
      name="description"
      content="Discover elegant modest fashion at Haya. Shop premium abayas, hijabs and everyday essentials thoughtfully selected for comfort, confidence and effortless style."
    />

    <meta name="author" content="Haya" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="googlebot" content="index, follow" />

    <link rel="canonical" href="https://byhaya.in/" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="shortcut icon"
      href="/favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <meta name="apple-mobile-web-app-title" content="Haya" />

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- Browser and Mobile Theme -->
    <meta name="theme-color" content="#625249" />

    <meta
      name="msapplication-TileColor"
      content="#625249"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Open Graph: WhatsApp, Facebook and LinkedIn -->
    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_IN" />

    <meta property="og:site_name" content="Haya" />

    <meta property="og:url" content="https://byhaya.in/" />

    <meta
      property="og:title"
      content="Haya | Modern Modest Fashion"
    />

    <meta
      property="og:description"
      content="Explore elegant abayas, hijabs and modest essentials designed for comfortable, effortless everyday dressing."
    />

    <meta
      property="og:image"
      content="https://byhaya.in/og-image.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://byhaya.in/og-image.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Haya modern modest fashion collection"
    />

    <!-- X / Twitter Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Haya | Modern Modest Fashion"
    />

    <meta
      name="twitter:description"
      content="Explore elegant abayas, hijabs and modest essentials by Haya."
    />

    <meta
      name="twitter:image"
      content="https://byhaya.in/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Haya modern modest fashion collection"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://byhaya.in/#organization",
        "name": "Haya",
        "url": "https://byhaya.in/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://byhaya.in/web-app-manifest-512x512.png",
          "width": 512,
          "height": 512
        },
        "description": "Haya is an Indian modest-fashion store offering abayas, hijabs and everyday modest essentials."
      }
    </script>

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://byhaya.in/#website",
        "url": "https://byhaya.in/",
        "name": "Haya",
        "alternateName": "Haya The Merchandising",
        "description": "Modern modest fashion, abayas, hijabs and everyday essentials in India.",
        "publisher": {
          "@id": "https://byhaya.in/#organization"
        },
        "inLanguage": "en-IN"
      }
    </script>
  </head>

  <body>
    <noscript>
      Haya requires JavaScript to provide the complete shopping experience.
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
